writeMode: pullRequest
commitMessage: "Use the self-hosted agent pool"
pullRequest:
  branchName: update-agent-pool
  title: "Use the self-hosted agent pool"
  description: "Bulk update of the agent pool in azure-pipelines.yml."
  draft: true
  autoMerge: false
operations:
  - replace:
      path: /azure-pipelines.yml
      find: "pool: Azure"
      replace: 'pool: { name: "Self-Hosted" }'
      useRegex: false
      onNoMatch: skip
