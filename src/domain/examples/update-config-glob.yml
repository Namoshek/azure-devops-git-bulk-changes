writeMode: pullRequest
commitMessage: "Normalize the agent pool in every pipeline config"
pullRequest:
  branchName: normalize-pipeline-config
  title: "Normalize the agent pool in every pipeline config"
  description: "Rewrites the agent pool line in every pipeline config file, at any depth."
  draft: true
  autoMerge: false
operations:
  - replace:
      pathPattern: "/**/azure-pipelines*.yml"
      find: "pool: Azure"
      replace: 'pool: { name: "Self-Hosted" }'
      useRegex: false
      onNoMatch: skip
