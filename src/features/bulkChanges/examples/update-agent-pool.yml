name: Update agent pool in azure-pipelines.yml
description: |
  Replaces the hosted agent pool with a self-hosted pool in every azure-pipelines.yml.
  Repositories without the pipeline file or without the pool line are skipped.
writeMode: pullRequest # directCommit | pullRequest
branchName: update-agent-pool
commitMessage: "Use the self-hosted agent pool"
pullRequest:
  title: "Use the self-hosted agent pool"
  description: "Bulk update of the agent pool in azure-pipelines.yml."
  draft: true
operations:
  - replace:
      path: /azure-pipelines.yml
      find: "pool: Azure"
      replace: 'pool: { name: "Self-Hosted" }'
      useRegex: false
      onNoMatch: skip # error | skip | createIfMissing
